<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Rodillian Runners — Content Editor</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/admin/custom.css" />
  <link
    href="/admin/config.yml"
    type="application/yaml"
    rel="cms-config-url"
  />

  <!--
    Decap CMS with Netlify Identity for Git Gateway authentication.

    This provides simple email/password login for non-technical users
    instead of requiring GitHub Personal Access Tokens. Netlify Identity
    handles user management and Git Gateway acts as a proxy to GitHub.

    The CMS mounts automatically after the scripts load. Any pre-mount
    UI would be wiped on mount, so the body stays empty.
  -->
  <script>
    // Surface any uncaught error or unhandled promise rejection on
    // the page as a visible diagnostic. Helps turn a blank page into
    // a useful error message when Decap CMS fails to initialise.
    function showAdminError(title, details) {
      var d = document.createElement('div');
      d.style.cssText = 'max-width:48rem;margin:2rem auto;padding:1.5rem;background:#fff;border-left:4px solid #dc2626;border-radius:8px;font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;';
      var h = document.createElement('h1');
      h.style.cssText = 'color:#dc2626;font-size:1.1rem;margin:0 0 .5rem;';
      h.textContent = title;
      var p = document.createElement('pre');
      p.style.cssText = 'background:#1f2937;color:#f9fafb;padding:1rem;border-radius:4px;overflow-x:auto;white-space:pre-wrap;font-size:12px;';
      p.textContent = details;
      d.appendChild(h); d.appendChild(p);
      (document.body || document.documentElement).appendChild(d);
    }
    window.addEventListener('error', function (e) {
      showAdminError(
        'Editor failed to load',
        (e.error && (e.error.stack || e.error.message)) || e.message || String(e)
      );
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      showAdminError(
        'Editor failed to initialise',
        (r && (r.stack || r.message)) || String(r)
      );
    });
  </script>

  <!-- Netlify Identity Widget for authentication -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Handle Identity login redirects -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (!user) {
          window.netlifyIdentity.on("login", function() {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</head>
<body>
  <!-- Decap CMS mounts into this root element -->
  <div id="nc-root"></div>
</body>
</html>
