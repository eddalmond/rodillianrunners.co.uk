<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Rodillian Runners — Content Editor</title>
  <link rel="icon" href="/favicon.ico" />
  <link
    href="/admin/config.yml"
    type="application/yaml"
    rel="cms-config-url"
  />

  <!--
    Sveltia CMS — drop-in successor to Decap CMS.

    The script tag below MUST NOT have type="module". Sveltia is
    distributed as a classic script and auto-mounts into the body.
    Adding type="module" makes the bundle load but never mount,
    which produces a blank page. This is documented in the
    Sveltia "Common Mistakes" section of the Start guide.

    The body must be effectively empty so Sveltia can render. Any
    pre-mount UI here would be wiped on mount.
  -->
  <script>
    // Surface any uncaught error or unhandled promise rejection on
    // the page as a visible diagnostic. Helps turn a blank page into
    // a useful error message when Sveltia fails to initialise.
    function showAdminError(title, details) {
      var d = document.createElement('div');
      d.style.cssText = 'max-width:48rem;margin:2rem auto;padding:1.5rem;background:#fff;border-left:4px solid #dc2626;border-radius:8px;font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;';
      var h = document.createElement('h1');
      h.style.cssText = 'color:#dc2626;font-size:1.1rem;margin:0 0 .5rem;';
      h.textContent = title;
      var p = document.createElement('pre');
      p.style.cssText = 'background:#1f2937;color:#f9fafb;padding:1rem;border-radius:4px;overflow-x:auto;white-space:pre-wrap;font-size:12px;';
      p.textContent = details;
      d.appendChild(h); d.appendChild(p);
      (document.body || document.documentElement).appendChild(d);
    }
    window.addEventListener('error', function (e) {
      showAdminError(
        'Editor failed to load',
        (e.error && (e.error.stack || e.error.message)) || e.message || String(e)
      );
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      showAdminError(
        'Editor failed to initialise',
        (r && (r.stack || r.message)) || String(r)
      );
    });
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</head>
<body>
  <!-- Intentionally empty. Sveltia mounts its UI here on load. -->
</body>
</html>
