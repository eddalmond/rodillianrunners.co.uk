# Static site config — no app server, just nginx serving files.
# Railway routes $PORT via env, default 8080 in our Dockerfile.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets aggressively
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Calendar ICS feed: short cache so updates propagate within the hour
    location = /calendar.ics {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Sveltia CMS admin — never cache, so config + JS updates ship immediately
    # and editors always see the current schema. /admin/* falls through here.
    location ^~ /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Custom error pages — must come AFTER the location blocks
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Clean URLs — Hugo generates /foo/index.html for /foo/
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Security headers (basic)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
